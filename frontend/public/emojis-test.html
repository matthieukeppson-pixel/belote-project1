<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test emojis</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .emoji-box {
      width: 110px;
      height: 110px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      border-radius: 12px;
    }

    .emoji-box img {
      max-width: 96px;
      max-height: 96px;
      display: block;
    }

    .label {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1>Test des emojis</h1>

  <div class="grid">
    <div class="card">
      <div class="emoji-box"><img src="/emojis/coeur.png" alt="coeur" /></div>
      <div class="label">coeur</div>
    </div>

    <div class="card">
      <div class="emoji-box"><img src="/emojis/cool.png" alt="cool" /></div>
      <div class="label">cool</div>
    </div>

    <div class="card">
      <div class="emoji-box"><img src="/emojis/langue.png" alt="langue" /></div>
      <div class="label">langue</div>
    </div>

    <div class="card">
      <div class="emoji-box"><img src="/emojis/pouce.png" alt="pouce" /></div>
      <div class="label">pouce</div>
    </div>

    <div class="card">
      <div class="emoji-box"><img src="/emojis/reflexion.png" alt="reflexion" /></div>
      <div class="label">reflexion</div>
    </div>

    <div class="card">
      <div class="emoji-box"><img src="/emojis/sourire.png" alt="sourire" /></div>
      <div class="label">sourire</div>
    </div>
  </div>
</body>
</html>
